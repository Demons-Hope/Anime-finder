<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime Finder</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
        url("./hooded-skull.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 0 0 15px black;
    }

    .subtitle {
      font-size: 18px;
      margin-bottom: 30px;
      color: #ddd;
    }

    .search-box {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    input {
      width: 60%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      outline: none;
    }

    button {
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5747d1;
    }

    #results {
      text-align: left;
    }

    .anime-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 25px;
    }

    .service-card {
      background: rgba(20, 20, 20, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
    }

    .service-info {
      flex: 1;
    }

    .service-name {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .service-details {
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
    }

    .watch-button {
      text-decoration: none;
      white-space: nowrap;
      background: #00b894;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      display: inline-block;
    }

    .watch-button:hover {
      background: #009f80;
    }

    .message {
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 20px;
      border-radius: 10px;
      font-size: 18px;
    }

    .loading {
      text-align: center;
      font-size: 18px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .search-box {
        flex-direction: column;
      }

      input {
        width: auto;
      }

      .service-card {
        flex-direction: column;
        align-items: stretch;
      }

      .watch-button {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Anime Finder</h1>

    <div class="subtitle">
      Find where you can legally watch your favorite anime.
    </div>

    <div class="search-box">
      <input
        type="text"
        id="animeSearch"
        placeholder="Enter anime name..."
        onkeydown="handleEnter(event)"
      >

      <button onclick="searchAnime()">
        Search
      </button>
    </div>

    <div id="results"></div>

  </div>

  <script>

    // Our Cloudflare Worker
    const WORKER_URL =
      "https://holy-lake-cba9.daviswillis232.workers.dev/";


    // Prevent HTML from being injected into the page
    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // Allow pressing Enter to search
    function handleEnter(event) {
      if (event.key === "Enter") {
        searchAnime();
      }
    }


    async function searchAnime() {

      const input =
        document.getElementById("animeSearch");

      const results =
        document.getElementById("results");

      const anime =
        input.value.trim();


      // Make sure something was entered
      if (!anime) {

        results.innerHTML = `
          <div class="message">
            Please enter an anime name.
          </div>
        `;

        return;
      }


      // Show loading message
      results.innerHTML = `
        <div class="loading">
          🔎 Searching for ${escapeHtml(anime)}...
        </div>
      `;


      try {

        // Ask our Cloudflare Worker
        const response = await fetch(
          WORKER_URL +
          "?q=" +
          encodeURIComponent(anime)
        );


        // Convert response to JSON
        const data =
          await response.json();


        // Worker returned an error
        if (!response.ok) {

          results.innerHTML = `
            <div class="message">
              ❌ ${escapeHtml(
                data.error || "Something went wrong."
              )}
            </div>
          `;

          return;
        }


        // Make sure the Worker returned a title
        if (!data.title) {

          results.innerHTML = `
            <div class="message">
              ❌ No anime was found.
            </div>
          `;

          return;
        }


        const title =
          data.title;


        // Get streaming sources
        const sources =
          Array.isArray(data.sources)
            ? data.sources
            : [];


        // Only show US availability
        const usSources =
          sources.filter(source =>
            source.region === "US"
          );


        // Remove duplicate services
        const uniqueSources = [];

        const seen = new Set();


        for (const source of usSources) {

          const key =
            source.source_id +
            "-" +
            source.type;

          if (!seen.has(key)) {

            seen.add(key);

            uniqueSources.push(source);
          }
        }


        // No US sources
        if (uniqueSources.length === 0) {

          results.innerHTML = `
            <div class="anime-title">
              ${escapeHtml(title.name)}
            </div>

            <div class="message">
              😕 No US streaming options were found.
            </div>
          `;

          return;
        }


        // Put subscription services first
        // and purchases afterward.
        uniqueSources.sort((a, b) => {

          if (a.type === "sub" && b.type !== "sub") {
            return -1;
          }

          if (a.type !== "sub" && b.type === "sub") {
            return 1;
          }

          return 0;
        });


        // Start the results HTML
        let html = `

          <div class="anime-title">
            ${escapeHtml(title.name)}
          </div>

        `;


        // Create a card for every service
        for (const source of uniqueSources) {

          let typeText = "Available";

          if (source.type === "sub") {
            typeText = "Subscription";
          }

          else if (source.type === "buy") {
            typeText = "Buy";
          }

          else if (source.type === "rent") {
            typeText = "Rent";
          }


          let priceText = "";


          if (source.price !== null &&
              source.price !== undefined) {

            priceText =
              ` • $${Number(source.price).toFixed(2)}`;
          }


          let formatText = "";

          if (source.format) {

            formatText =
              ` • ${escapeHtml(source.format)}`;
          }


          let episodeText = "";

          if (source.episodes) {

            episodeText =
              ` • ${source.episodes} episodes`;
          }


          html += `

            <div class="service-card">

              <div class="service-info">

                <div class="service-name">
                  ${escapeHtml(source.name)}
                </div>

                <div class="service-details">

                  ${escapeHtml(typeText)}
                  ${priceText}
                  ${formatText}
                  ${episodeText}

                </div>

              </div>

              ${
                source.web_url
                  ? `
                    <a
                      class="watch-button"
                      href="${escapeHtml(source.web_url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Watch Now
                    </a>
                  `
                  : ""
              }

            </div>

          `;
        }


        // Put everything onto the page
        results.innerHTML = html;


      } catch (error) {

        console.error(error);

        results.innerHTML = `

          <div class="message">

            ❌ Something went wrong while
            searching for the anime.

          </div>

        `;
      }
    }

  </script>

</body>
</html>
