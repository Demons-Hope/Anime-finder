<!DOCTYPE html>
<html>
<head>
    <title>Anime Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family: Arial, sans-serif;
            color: white;

            background: #000000;

            position: relative;
        }

        /* =================================
           CRYSTAL LIGHT BACKGROUND
           ================================= */

        body::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    125deg,
                    transparent 0%,
                    transparent 20%,
                    rgba(90, 0, 15, 0.55) 20%,
                    rgba(90, 0, 15, 0.55) 30%,
                    transparent 30%
                ),

                linear-gradient(
                    35deg,
                    transparent 0%,
                    transparent 35%,
                    rgba(130, 0, 25, 0.30) 35%,
                    rgba(130, 0, 25, 0.30) 48%,
                    transparent 48%
                ),

                linear-gradient(
                    155deg,
                    transparent 0%,
                    transparent 48%,
                    rgba(70, 0, 12, 0.65) 48%,
                    rgba(70, 0, 12, 0.65) 63%,
                    transparent 63%
                ),

                linear-gradient(
                    70deg,
                    transparent 0%,
                    transparent 62%,
                    rgba(150, 5, 25, 0.25) 62%,
                    rgba(150, 5, 25, 0.25) 70%,
                    transparent 70%
                );

            z-index: 0;
        }

        /* Crystal facets */

        body::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    115deg,
                    transparent 0%,
                    transparent 47%,
                    rgba(255, 40, 55, 0.16) 47.3%,
                    transparent 48%
                ),

                linear-gradient(
                    65deg,
                    transparent 0%,
                    transparent 53%,
                    rgba(255, 30, 45, 0.12) 53.3%,
                    transparent 54%
                ),

                linear-gradient(
                    145deg,
                    transparent 0%,
                    transparent 72%,
                    rgba(190, 10, 30, 0.18) 72.3%,
                    transparent 73%
                );

            z-index: 1;
            pointer-events: none;
        }
