<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anime Finder</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: white;
    }

    body {
      min-height: 100vh;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.28),
          rgba(0, 0, 0, 0.55)
        ),
        url("./hooded-skull.png") center center / cover fixed no-repeat;

      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          transparent 15%,
          rgba(0, 0, 0, 0.18) 45%,
          rgba(0, 0, 0, 0.72) 100%
        );

      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;

      width: calc(100% - 30px);
      max-width: 650px;

      margin: 55px auto 0;
      padding: 32px 20px 35px;

      background: rgba(0, 0, 0, 0.72);

      border: 1px solid rgba(150, 0, 0, 0.8);
      border-radius: 18px;

      box-shadow:
        0 0 25px rgba(120, 0, 0, 0.35),
        inset 0 0 30px rgba(80, 0, 0, 0.15);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      text-align: center;
    }

    h1 {
      margin: 0 0 10px;

      font-size: clamp(30px, 8vw, 48px);
      letter-spacing: 1px;

      text-shadow:
        0 0 10px rgba(150, 0, 0, 0.8),
        0 0 25px rgba(100, 0, 0, 0.5);
    }

    h1 span {
      color: #8b0000;
    }

    .subtitle {
      margin: 0 0 25px;

      color: #cfcfcf;
      font-size: 15px;
    }

    .search-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 16px 18px;

      border: 1px solid #600000;
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.8);
      color: white;

      font-size: 16px;
      outline: none;

      box-shadow:
        inset 0 0 12px rgba(100, 0, 0, 0.2);
    }

    input::placeholder {
      color: #888;
    }

    input:focus {
      border-color: #a00000;

      box-shadow:
        0 0 12px rgba(140, 0, 0, 0.45),
        inset 0 0 12px rgba(100, 0, 0, 0.2);
    }

    button {
      width: 100%;
      padding: 16px;

      border: none;
      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #7a0000,
        #b00000
      );

      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 15px rgba(140, 0, 0, 0.45);

      transition: 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      box-shadow:
        0 0 25px rgba(180, 0, 0, 0.65);
    }

    #results {
      margin-top: 25px;
      text-align: left;
    }

    .result-card {
      padding: 20px;

      background: rgba(10, 10, 10, 0.85);

      border: 1px solid rgba(150, 0, 0, 0.7);
      border-radius: 15px;

      box-shadow:
        0 0 20px rgba(120, 0, 0, 0.25);
    }

    .result-card h2 {
      margin: 0 0 10px;

      color: #ffffff;
      font-size: 24px;
    }

    .result-card p {
      margin: 8px 0;

      color: #cfcfcf;
      line-height: 1.5;
    }

    .watch-title {
      margin-top: 18px !important;

      color: #a00000 !important;
      font-weight: bold;
    }

    .watch-option {
      margin-top: 8px;
      padding: 12px;

      background: rgba(80, 0, 0, 0.25);

      border-left: 3px solid #900000;
      border-radius: 8px;
    }

    .error {
      color: #ff7777;
      text-align: center;
    }

    @media (min-width: 600px) {
      .container {
        margin-top: 80px;
        padding: 35px 30px 40px;
      }

      .search-area {
        flex-direction: row;
      }

      input {
        flex: 1;
      }

      button {
        width: 130px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🍿 Anime <span>Finder</span></h1>

    <p class="subtitle">
      Find where to watch your favorite anime.
    </p>

    <div class="search-area">

      <input
        type="text"
        id="animeSearch"
        placeholder="Search for an anime..."
        onkeydown="handleEnter(event)"
      >

      <button onclick="searchAnime()">
        Search
      </button>

    </div>

    <div id="results"></div>

  </main>

  <script>

    /*
      Cloudflare Worker
      This keeps the Watchmode API key hidden.
    */

    const WORKER_URL =
      "https://holy-lake-cba9.daviswillis232.workers.dev/";

    function handleEnter(event) {
      if (event.key === "Enter") {
        searchAnime();
      }
    }

    async function searchAnime() {

      const anime =
        document
          .getElementById("animeSearch")
          .value
          .trim();

      const results =
        document.getElementById("results");

      if (anime === "") {

        results.innerHTML = `
          <div class="result-card">
            <p class="error">
              Enter an anime first! 🍿
            </p>
          </div>
        `;

        return;
      }

      results.innerHTML = `
        <div class="result-card">

          <h2>${anime}</h2>

          <p>
            Anime found! We're checking
            where you can legally watch it.
          </p>

          <p class="watch-title">
            Where to watch
          </p>

          <div class="watch-option">
            🔎 Checking availability...
          </div>

        </div>
      `;

      try {

        const response =
          await fetch(
            WORKER_URL +
            "?q=" +
            encodeURIComponent(anime)
          );

        if (!response.ok) {
          throw new Error(
            "Worker returned HTTP " +
            response.status
          );
        }

        const data =
          await response.json();

        console.log(
          "Watchmode response:",
          data
        );

        const titles =
          (data.title_results || [])
            .filter(title =>
              title.type === "tv_series"
            )
            .slice(0, 5);

        if (titles.length === 0) {

          results.innerHTML = `
            <div class="result-card">

              <h2>${anime}</h2>

              <p class="error">
                No matching anime series were found.
              </p>

            </div>
          `;

          return;
        }

        results.innerHTML = `
          <div class="result-card">

            <h2>Results for "${anime}"</h2>

            <p>
              Watchmode found ${titles.length}
              matching anime series.
            </p>

            <p class="watch-title">
              Matches
            </p>

            ${titles.map(title => `

              <div class="watch-option">

                📺 <strong>${title.name}</strong>

                ${
                  title.year
                    ? ` (${title.year})`
                    : ""
                }

              </div>

            `).join("")}

          </div>
        `;

      } catch (error) {

        console.error(
          "Anime Finder error:",
          error
        );

        results.innerHTML = `
          <div class="result-card">

            <h2>${anime}</h2>

            <p class="error">
              ⚠️ We couldn't connect to
              the availability service.
            </p>

            <p>
              ${error.message}
            </p>

          </div>
        `;

      }

    }

  </script>

</body>
</html>
