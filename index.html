<!DOCTYPE html>
<html>
<head>
    <title>Anime Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at top left, #5c0a0a 0%, transparent 35%),
                radial-gradient(circle at bottom right, #3a0505 0%, transparent 40%),
                linear-gradient(135deg, #050505, #170606, #050505);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 40px 25px;
            text-align: center;

            background: rgba(15, 15, 15, 0.92);
            border: 1px solid #5c1515;
            border-radius: 18px;

            box-shadow:
                0 0 25px rgba(150, 0, 0, 0.25),
                0 15px 40px rgba(0, 0, 0, 0.6);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 38px;
            letter-spacing: 1px;
        }

        h1 span {
            color: #e32626;
        }

        p {
            color: #c7c7c7;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #542020;
            background: #090909;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #c52222;
            box-shadow: 0 0 10px rgba(200, 0, 0, 0.25);
        }

        button {
            padding: 15px 22px;
            border: none;
            border-radius: 10px;

            background: #b71919;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #d52222;
        }

        @media (max-width: 500px) {
            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🍿 <span>Anime</span> Finder</h1>

        <p>Find where to watch your favorite anime.</p>

        <div class="search-box">
            <input
                type="text"
                placeholder="Search for an anime..."
            >

            <button>Search</button>
        </div>

    </div>

</body>
</html>
